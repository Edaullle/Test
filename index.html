<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dofus 3 - Trouver le meilleur build</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="header-container">
        <span class="season-badge">🌟 Saison du Dofus Turquoise 🌟</span>
        <h1>Dofus 3 Builds</h1>
        <p>Trouvez les meilleurs builds pour votre personnage !</p>
    </div>
</header>

<main class="container">
    <section class="search-section">
        <form id="build-form">
            <div class="form-group">
                <label for="class-select">Classe :</label>
                <select id="class-select" required>
                    <option value="" disabled selected>Sélectionnez une classe</option>
                    <option value="Cra">Crâ</option>
                    <option value="Ecaflip">Ecaflip</option>
                    <option value="Eliotrope">Eliotrope</option>
                    <option value="Eniripsa">Eniripsa</option>
                    <option value="Enutrof">Enutrof</option>
                    <option value="Feca">Féca</option>
                    <option value="Forgelance">Forgelance</option>
                    <option value="Huppermage">Huppermage</option>
                    <option value="Iop">Iop</option>
                    <option value="Osamodas">Osamodas</option>
                    <option value="Ouginak">Ouginak</option>
                    <option value="Pandawa">Pandawa</option>
                    <option value="Roublard">Roublard</option>
                    <option value="Sacrieur">Sacrieur</option>
                    <option value="Sadida">Sadida</option>
                    <option value="Sram">Sram</option>
                    <option value="Steamer">Steamer</option>
                    <option value="Xelor">Xélor</option>
                    <option value="Zobal">Zobal</option>
                </select>
            </div>

            <div class="form-group">
                <label for="element-select">Élément :</label>
                <select id="element-select" required>
                    <option value="" disabled selected>Sélectionnez un élément</option>
                    <option value="Terre">Terre</option>
                    <option value="Feu">Feu</option>
                    <option value="Eau">Eau</option>
                    <option value="Air">Air</option>
                    <option value="Multi">Multi-éléments</option>
                </select>
            </div>

            <button type="submit" id="search-btn">Chercher un build</button>
        </form>
    </section>

    <section id="results-section">
        <!-- Les résultats seront injectés ici par le script.js -->
    </section>
</main>

<footer>
    <p>Ce site n'est pas affilié à Ankama. Outil communautaire pour Dofus 3.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
